# Full investigator egress. Model access is composed from the attached provider profile.
# No model endpoint is duplicated in this base policy. Synthetic document service 8031 is outside policy.
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /app
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

network_policies:
  pattern1_knowledge:
    name: pattern1_knowledge
    endpoints:
      - host: '192.168.127.254'
        port: 8010
        protocol: rest
        tls: skip
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/responses
          - allow:
              method: POST
              path: /v1/retrieve
          - allow:
              method: GET
              path: /health
          - allow:
              method: GET
              path: /v1/graph/status
          - allow:
              method: GET
              path: /v1/graph/evidence
    binaries:
      - path: /usr/local/bin/python3.12
