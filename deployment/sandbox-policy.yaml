# OpenShell sandbox policy for AMI Demo 3 — Port Impact Investigator.
#
# Allowlist egress for the sandboxed UI:
#   - the Pattern1 Graph AutoRAG service on the host (port 8010): retrieval,
#     health, and the read-only graph inspection endpoints, method-scoped;
#   - Ollama on the host (port 11434): chat completions and model listing for
#     the live bounded agent.
# Other destinations are not allowlisted. Enforcement of this maritime
# deployment configuration has not yet been verified.
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

network_policies:
  pattern1_knowledge:
    name: pattern1_knowledge
    endpoints:
      - host: '192.168.127.254'
        port: 8010
        protocol: rest
        tls: skip
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/responses
          - allow:
              method: POST
              path: /v1/retrieve
          - allow:
              method: GET
              path: /health
          - allow:
              method: GET
              path: /v1/graph/status
          - allow:
              method: GET
              path: /v1/graph/evidence
    binaries:
      - path: /usr/local/bin/python3.12

  ollama_inference:
    name: ollama_inference
    endpoints:
      - host: '192.168.127.254'
        port: 11434
        protocol: rest
        tls: skip
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
          - allow:
              method: GET
              path: /v1/models
    binaries:
      - path: /usr/local/bin/python3.12
