name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.26'
      - run: uv sync --python 3.12 --all-extras --locked
      - run: uv sync --project pattern1 --python 3.12 --extra dev --locked
      - run: .venv/bin/python -m pytest tests -q
      - run: cd pattern1 && .venv/bin/python -m unittest discover -s tests -q
