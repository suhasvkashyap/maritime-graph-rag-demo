<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#172b3a;background:#fff;font-size:13px}.shell{border:1px solid #d4dce2;border-radius:12px;overflow:hidden}.toolbar{display:flex;gap:8px;align-items:center;padding:12px;background:#f5f7fa;flex-wrap:wrap}button,input{font:inherit;border:1px solid #bac6d1;border-radius:6px;padding:7px 10px;background:white;color:#172b3a}button{cursor:pointer}button:hover{background:#e7edf4}button:focus-visible,input:focus-visible{outline:3px solid #168aad}input{flex:1;min-width:150px}.legend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 14px;border-bottom:1px solid #e0e6eb;font-size:11px}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}#map{width:100%;height:550px;background:#fafbfd;display:block;cursor:grab;touch-action:none}#map:active{cursor:grabbing}.node{cursor:pointer}.node rect{fill:white;stroke-width:1.8}.node text{pointer-events:none}.node:focus{outline:none}.node:focus rect{stroke-width:4}.edge{cursor:pointer}.edge path.line{fill:none;stroke:#95a4b2;stroke-width:1.5;marker-end:url(#arrow)}.edge .hit{fill:none;stroke:transparent;stroke-width:14}.edge text{font-size:9px;fill:#536777;paint-order:stroke;stroke:#fafbfd;stroke-width:4;stroke-linejoin:round}.dim{opacity:.12}.active path.line{stroke:#c42525;stroke-width:3;marker-end:url(#selected-arrow)}.active text{fill:#a51d1d;font-weight:700}.node.active rect{stroke-width:3;fill:#fff8ef}.lane{font-size:11px;font-weight:700;fill:#657688;letter-spacing:1px}.detail{padding:12px 16px;height:150px;overflow:auto;border-top:1px solid #d4dce2;background:#fff}.detail h3{margin:0 0 6px;font-size:15px}.detail p{margin:5px 0;line-height:1.5}.relation{padding:6px 0;border-top:1px solid #edf0f3}.muted{color:#637486}.tip{margin-left:auto;color:#637486;font-size:11px}.note{font-size:11px;color:#637486;padding:6px 14px}#searchStatus{min-width:60px;font-size:11px}
</style></head><body><div class="shell">
<div class="toolbar"><input id="search" aria-label="Find an entity" placeholder="Find a vessel, call, company or shipment…"><span id="searchStatus" aria-live="polite"></span><button id="minus" aria-label="Zoom out">−</button><button id="plus" aria-label="Zoom in">+</button><button id="fit">Fit all</button><button id="reset">Clear selection</button><label><input type="checkbox" id="labels" checked style="min-width:0"> Edge labels</label></div>
<div class="legend" id="legend"></div>
<svg id="map" role="img" aria-label="Complete maritime knowledge graph. Select a node or relationship for details."><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#95a4b2"/></marker><marker id="selected-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c42525"/></marker></defs><g id="world"></g></svg>
<div class="note">Drag to pan · Scroll or use +/− to zoom · Select any node or arrow to inspect connections · All entities stay in the view</div>
<div id="details" class="detail" aria-live="polite"></div></div>
<script type="application/json" id="graph-data">__GRAPH_DATA__</script>
<script>
const graph=JSON.parse(document.getElementById('graph-data').textContent), svg=document.getElementById('map'),world=document.getElementById('world'),details=document.getElementById('details');
const NS='http://www.w3.org/2000/svg', W=164,H=58, pitch=220;
const lanes=['GROUP','OPERATORS','VESSELS & ALIASES','PORT CALLS','PLACES & NOTICES','CARGO & PROPOSALS','RECEIVING CHAIN'];
const colors=['#6644aa','#2167a8','#00847b','#a86a05','#ad4040','#8056aa','#54753d'];
const aliases=new Set(graph.edges.filter(e=>e.relationship==='formerly_named').map(e=>e.target_id));
function rank(n){const x=n.name.toUpperCase();if(x.startsWith('SYN-G'))return 0;if(x.startsWith('SYN-O'))return 1;if(x.startsWith('SYN-V')||aliases.has(n.id))return 2;if(x.startsWith('SYN-C')||n.kind==='Correction')return 3;if(x.startsWith('SYN-B')||x.startsWith('SYN-N')||x.startsWith('BERTH ')||x.startsWith('PORT '))return 4;if(x.startsWith('SYN-S')||n.kind==='Proposal')return 5;return 6}
const nodes=graph.nodes.map(n=>({...n,rank:rank(n)})), byId=new Map(nodes.map(n=>[n.id,n]));
const columns=lanes.map((_,i)=>nodes.filter(n=>n.rank===i).sort((a,b)=>a.name.localeCompare(b.name)));
// Order each lane by neighboring rows to reduce crossings without omitting edges.
for(let pass=0;pass<4;pass++)for(let col=1;col<columns.length;col++){const prev=new Map(columns.slice(0,col).flatMap(c=>c.map((n,i)=>[n.id,i])));const score=n=>{const links=graph.edges.filter(e=>e.source_id===n.id||e.target_id===n.id).map(e=>prev.get(e.source_id===n.id?e.target_id:e.source_id)).filter(v=>v!==undefined);return links.length?links.reduce((a,b)=>a+b,0)/links.length:99};columns[col].sort((a,b)=>score(a)-score(b)||a.name.localeCompare(b.name))}
const rows=Math.max(...columns.map(c=>c.length)), width=7*pitch+20,height=rows*94+90;
columns.forEach((col,i)=>col.forEach((n,j)=>{n.x=26+i*pitch;n.y=70+j*94+(rows-col.length)*47}));
function el(tag,attrs={},text=''){const x=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>x.setAttribute(k,v));if(text)x.textContent=text;return x}
function html(tag,text,cls,parent=details){const x=document.createElement(tag);x.textContent=text;if(cls)x.className=cls;parent.append(x);return x}
lanes.forEach((name,i)=>{world.append(el('text',{x:26+i*pitch,y:30,class:'lane'},name));const l=html('span','',null,document.getElementById('legend'));const dot=html('span','', 'dot',l);dot.style.background=colors[i];l.append(document.createTextNode(name.toLowerCase()))});
const edgeEls=[];
graph.edges.forEach((e,i)=>{const a=byId.get(e.source_id),b=byId.get(e.target_id),g=el('g',{class:'edge',tabindex:0,role:'button','aria-label':`${a.name} ${e.relationship} ${b.name}`});let x1,y1,x2,y2,c1,c2;
if(a.x===b.x){x1=a.x+W;y1=a.y+H/2;x2=b.x+W;y2=b.y+H/2;c1=x1+38+(i%4)*12;c2=c1}else{const right=b.x>a.x;x1=a.x+(right?W:0);x2=b.x+(right?0:W);y1=a.y+H/2;y2=b.y+H/2;const dx=Math.abs(x2-x1)*.42;c1=x1+(right?dx:-dx);c2=x2+(right?-dx:dx)}
const parallel=graph.edges.filter(other=>other.source_id===e.source_id&&other.target_id===e.target_id), offset=(parallel.indexOf(e)-(parallel.length-1)/2)*28;
const d=`M${x1},${y1} C${c1},${y1+offset} ${c2},${y2+offset} ${x2},${y2}`;g.append(el('path',{d,class:'hit'}),el('path',{d,class:'line'}));const lx=.125*x1+.375*c1+.375*c2+.125*x2,ly=(y1+y2)/2+.75*offset;g.append(el('text',{x:lx,y:ly-5,'text-anchor':'middle'},e.relationship.replaceAll('_',' ')));g.append(el('title',{},`${e.source} → ${e.relationship} → ${e.target}`));g.onclick=()=>selectEdge(i);g.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();selectEdge(i)}};world.append(g);edgeEls.push(g)});
const nodeEls=new Map();
function wrap(text,max){const words=text.split(' '),lines=[''];words.forEach(w=>{if((lines.at(-1)+' '+w).trim().length>max&&lines.at(-1))lines.push(w);else lines[lines.length-1]=(lines.at(-1)+' '+w).trim()});return lines}
nodes.forEach(n=>{const g=el('g',{class:'node',tabindex:0,role:'button','aria-label':n.display_name||n.name});g.append(el('rect',{x:n.x,y:n.y,width:W,height:H,rx:8,stroke:colors[n.rank]}));const title=n.display_name||n.name,lines=wrap(title,24);lines.slice(0,2).forEach((t,i)=>g.append(el('text',{x:n.x+10,y:n.y+18+i*14,'font-size':12.5,'font-weight':650,fill:'#21384b'},t)));const subtitle=title!==n.name?n.name:(n.kind==='Entity'?'':n.kind);g.append(el('text',{x:n.x+10,y:n.y+49,'font-size':10,fill:colors[n.rank]},subtitle));g.append(el('title',{},`${title} · ${n.name}`));g.onclick=()=>selectNode(n.id);g.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();selectNode(n.id)}};world.append(g);nodeEls.set(n.id,g)});
function clearStyles(){nodeEls.forEach(g=>g.setAttribute('class','node'));edgeEls.forEach(g=>g.setAttribute('class','edge'))}
function describeEdge(e){const row=html('div','', 'relation');html('strong',`${byId.get(e.source_id).display_name||e.source} → ${e.relationship.replaceAll('_',' ')} → ${byId.get(e.target_id).display_name||e.target}`,null,row);e.chunks.forEach(c=>html('p',`${c.section_id||c.chunk_id}: ${c.excerpt||''}`,'muted',row));if(!e.chunks.length)html('p','No source chunk attached to this relationship.','muted',row)}
function selectNode(id){document.getElementById('search').value='';clearStyles();const connected=new Set([id]);graph.edges.forEach((e,i)=>{const on=e.source_id===id||e.target_id===id;edgeEls[i].classList.add(on?'active':'dim');if(on){connected.add(e.source_id);connected.add(e.target_id)}});nodeEls.forEach((g,nid)=>g.classList.add(connected.has(nid)?'active':'dim'));details.replaceChildren();const n=byId.get(id);html('h3',`${n.display_name||n.name} · ${n.name}`);html('p','Highlighted: every incoming and outgoing relationship. The rest of the graph remains visible.','muted');graph.edges.filter(e=>e.source_id===id||e.target_id===id).forEach(describeEdge)}
function selectEdge(i){clearStyles();const e=graph.edges[i];nodeEls.forEach((g,id)=>g.classList.add(id===e.source_id||id===e.target_id?'active':'dim'));edgeEls.forEach((g,j)=>g.classList.add(i===j?'active':'dim'));details.replaceChildren();html('h3','Relationship and source evidence');describeEdge(e)}
function reset(){clearStyles();document.getElementById('search').value='';document.getElementById('searchStatus').textContent='';details.replaceChildren();html('h3',`${nodes.length} entities · ${graph.edges.length} directed relationships — one complete view`);html('p','Read across the map: corporate group → operators → vessels → port calls → berths and notices → cargo → recipients. Arrow direction preserves the actual stored relationship. Select any entity or edge to see its source evidence.');html('p','Corrections and proposals are shown alongside the original records. Their presence does not imply an approved action or an as-of conclusion.','muted')}
let scale=1,tx=0,ty=0;function transform(){world.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`)}function fit(){scale=Math.min(svg.clientWidth/width,svg.clientHeight/height)*.96;tx=(svg.clientWidth-width*scale)/2;ty=(svg.clientHeight-height*scale)/2;transform()}function zoom(f,x=svg.clientWidth/2,y=svg.clientHeight/2){const next=Math.max(.15,Math.min(3,scale*f));tx=x-(x-tx)*next/scale;ty=y-(y-ty)*next/scale;scale=next;transform()}
document.getElementById('fit').onclick=fit;document.getElementById('plus').onclick=()=>zoom(1.25);document.getElementById('minus').onclick=()=>zoom(.8);document.getElementById('reset').onclick=reset;document.getElementById('labels').onchange=e=>edgeEls.forEach(g=>g.querySelector('text').style.display=e.target.checked?'':'none');svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(e.deltaY<0?1.1:1/1.1,e.clientX-r.left,e.clientY-r.top)},{passive:false});let drag=null;svg.onpointerdown=e=>{if(e.target.closest('.node,.edge'))return;drag={x:e.clientX,y:e.clientY,tx,ty};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(drag){tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;transform()}};svg.onpointerup=()=>drag=null;svg.onpointercancel=()=>drag=null;
document.getElementById('search').oninput=e=>{clearStyles();const q=e.target.value.toLowerCase().trim(),found=new Set(nodes.filter(n=>(n.name+' '+n.display_name).toLowerCase().includes(q)).map(n=>n.id));if(!q){reset();return}document.getElementById('searchStatus').textContent=`${found.size} found`;nodeEls.forEach((g,id)=>g.classList.add(found.has(id)?'active':'dim'));graph.edges.forEach((e,i)=>edgeEls[i].classList.add(found.has(e.source_id)||found.has(e.target_id)?'active':'dim'))};new ResizeObserver(fit).observe(svg);reset();fit();
</script></body></html>
